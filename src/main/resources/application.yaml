spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: sentinelflow
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelflow_postgres
    username: sentinelflow_admin
    password: secure_local_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Ensures listener container waits for active messages to finish before stopping
      ack-mode: record
  management:
    endpoints:
      web:
        exposure:
          include: health, metrics, prometheus
    endpoint:
      health:
        show-details: always
    metrics:
      tags:
        application: sentinelflow