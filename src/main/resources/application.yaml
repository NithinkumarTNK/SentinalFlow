spring:
  application:
    name: sentinelflow
  datasource:
    url: jdbc:postgresql://localhost:5432/sentinelflow_postgres
    username: sentinelflow_admin
    password: secure_local_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer